<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Cesium Thai Map Example</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.97/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.97/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            font-family: 'Sarabun', sans-serif;
        }
    </style>
    <!-- 引入泰语字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        // 初始化Cesium viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            terrainProvider: Cesium.createWorldTerrain()
        });
        
        // 设置曼谷为初始视图
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(100.5018, 13.7563, 15000),
            orientation: {
                heading: Cesium.Math.toRadians(0.0),
                pitch: Cesium.Math.toRadians(-15.0),
            }
        });
        
        // 添加泰语标签示例
        const entities = viewer.entities;
        
        // 添加城市标签
        entities.add({
            position: Cesium.Cartesian3.fromDegrees(100.5018, 13.7563),
            label: {
                text: 'กรุงเทพมหานคร',
                font: '28px Sarabun, sans-serif',
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                pixelOffset: new Cesium.Cartesian2(0, -10),
                scale: 1.2,
                translucencyByDistance: new Cesium.NearFarScalar(1.5e2, 1.0, 1.5e7, 0.5)
            },
            point: {
                pixelSize: 8,
                color: Cesium.Color.RED
            }
        });
        
        // 添加省份标签
        const provinces = [
            { name: 'เชียงใหม่', lon: 98.9696, lat: 18.7969 },
            { name: 'ชลบุรี', lon: 100.9925, lat: 13.3677 },
            { name: 'ภูเก็ต', lon: 98.3380, lat: 7.9519 },
            { name: 'ขอนแก่น', lon: 102.8353, lat: 16.4453 }
        ];
        
        provinces.forEach(province => {
            entities.add({
                position: Cesium.Cartesian3.fromDegrees(province.lon, province.lat),
                label: {
                    text: province.name,
                    font: '22px Sarabun, sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    verticalOrigin: Cesium.VerticalOrigin.CENTER,
                    pixelOffset: new Cesium.Cartesian2(15, 0)
                },
                point: {
                    pixelSize: 6,
                    color: Cesium.Color.BLUE
                }
            });
        });
        
        // 添加泰语样式的地形
        viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
            url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            credit: 'Map data © OpenStreetMap contributors'
        }));
    </script>
</body>
</html>
